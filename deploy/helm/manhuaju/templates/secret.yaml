manhuaju-secrets is expected to be created out-of-band (e.g. by
ExternalSecrets Operator + 火山 KMS, or via `kubectl create secret`).
This file is a template stub for sealed-secret manifests; keep empty for safety.

To create manually:

    kubectl create secret generic manhuaju-secrets \
      --from-env-file=.env \
      --namespace=manhuaju

To use ExternalSecrets:

    apiVersion: external-secrets.io/v1beta1
    kind: ExternalSecret
    metadata:
      name: manhuaju-secrets
    spec:
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: volcengine-kms
      target:
        name: manhuaju-secrets
        creationPolicy: Owner
      data:
        - secretKey: ANTHROPIC_API_KEY
