        - secretKey: VOLCENGINE_VISUAL_SK
          remoteRef:
            key: manhuaju/volc_visual_sk
        - secretKey: VOLCENGINE_TOS_AK
          remoteRef:
            key: manhuaju/tos_ak
        - secretKey: VOLCENGINE_TOS_SK
          remoteRef:
            key: manhuaju/tos_sk
        - secretKey: ELEVENLABS_API_KEY
          remoteRef:
            key: manhuaju/elevenlabs_api_key
        - secretKey: FAL_KEY
          remoteRef:
            key: manhuaju/fal_key
        - secretKey: DASHSCOPE_API_KEY
          remoteRef:
            key: manhuaju/dashscope_api_key
