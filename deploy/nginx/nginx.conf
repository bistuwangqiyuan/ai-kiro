user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css text/javascript application/json application/javascript;

    log_format jsonlog escape=json '{ "ts":"$time_iso8601","ip":"$remote_addr","host":"$host",'
        '"method":"$request_method","uri":"$request_uri","status":$status,"rt":$request_time,'
        '"ua":"$http_user_agent","ref":"$http_referer","len":$body_bytes_sent }';
    access_log /var/log/nginx/access.log jsonlog;

    upstream manhuaju_api {
        server api:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # API
        location / {
            proxy_pass http://manhuaju_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 600;
            client_max_body_size 100M;
        }

        # health (cheap probe)
        location = /health {
            proxy_pass http://manhuaju_api;
            access_log off;
        }
    }
}
