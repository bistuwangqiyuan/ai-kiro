# ============================================================
# AI 漫剧 Autopilot v4 — KPI 阈值
# ============================================================

thresholds:
  # ---- 一致性 ----
  arcface_min: 0.92              # 跨集主角脸相似度（insightface ArcFace）
  arcface_shot_drift_max: 0.05   # 单集内最大漂移
  laion_mean_min: 6.0
  laion_worst_min: 5.5
  vbench_min: 0.85
  utmos_min: 4.0
  syncnet_offset_max_frames: 2.0
  determinism_min: 0.95
  cycles_max: 3

  # ---- v4 新增：VLM 7 维（Doubao Seed 1.6）----
  seven_dim_mean_min: 8.0        # 7 维 mean
  seven_dim_worst_min: 6.0
  seven_dim:
    structure: 8.0               # 结构正确性
    style: 8.5                   # 风格一致性
    detail: 7.5                  # 细节完整性
    clarity: 8.0                 # 画质清晰度
    color: 8.0                   # 色彩协调性
    no_distortion: 9.0           # 无崩坏（面/手/肢）
    intent_match: 8.5            # 意图匹配度

  # ---- v4 新增：合规与安全 ----
  sensitive_high_hit_max: 0      # 高敏感词 0 容忍
  sensitive_medium_hit_after_retry_max: 0
  garbled_text_rate_max: 0.0     # AI 字层乱码率 0%（强制 ASS）
  copyright_similarity_max: 0.85 # SimHash + LLM 双判

  # ---- v4 新增：分发与运营 ----
  platforms_required:            # 必须 3 平台齐备
    - "douyin"
    - "kuaishou"
    - "weixin"
  cover_required: true
  copy_required: true            # 标题/简介/tags/引流文案

# ---- 运行时间上限 ----
runtime_caps_seconds:
  per_episode_mock: 300          # mock 5 min
  per_episode_live: 1800         # live 30 min (tech.md 小云雀官方)
  per_episode_live_hard: 2400    # 40 min 硬上限
  per_project_pilot: 1800
  per_project_v4_three: 5400     # 3 集 v4 ≤ 90 min

# ---- 成本上限 ----
cost_caps_credits:
  per_episode: 0                 # mock
  per_project_pilot: 0
cost_caps_rmb:
  per_episode_v4_target: 60      # tech.md 软目标
  per_episode_v4_hard: 80        # 硬上限
  per_project_v4_three: 200      # 3 集
  monthly_cap_rmb: 150000        # 月度 ¥15w（产能 1500-2000 集）

# ---- v4 增量 REQ ID -> 阈值映射 ----
v4_acceptance:
  REQ_V4_001:                    # 跨集 ArcFace 真实测量
    metric: "arcface_min"
    op: ">="
    value: 0.92
  REQ_V4_002:                    # 7 维 VLM QA mean
    metric: "seven_dim_mean_min"
    op: ">="
    value: 8.0
  REQ_V4_003:                    # 单集端到端
    metric: "per_episode_live"
    op: "<="
    value: 1800
  REQ_V4_004:                    # 单集成本
    metric: "per_episode_v4_target"
    op: "<="
    value: 60
  REQ_V4_005:                    # 月产能
    metric: "monthly_episodes_min"
    op: ">="
    value: 1500
  REQ_V4_006:                    # 文字乱码率
    metric: "garbled_text_rate_max"
    op: "<="
    value: 0.0
  REQ_V4_007:                    # 敏感词阻断
    metric: "sensitive_high_hit_max"
    op: "<="
    value: 0
  REQ_V4_008:                    # 3 平台导出齐全
    metric: "platforms_required"
    op: "subset"
    value: ["douyin", "kuaishou", "weixin"]
