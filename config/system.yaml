# ============================================================
# AI 漫剧 Autopilot v4 — system.yaml
# 小云雀 Agent 2.0 快路径 + 5 层外壳 + 12 大需求落地
# ============================================================

project:
  default_seed: 20260516
  default_budget_tier: "M"          # v4 升级：M (75s 单集)
  default_resolution: "1080p"
  default_fps: 24
  default_aspect_ratio: "9:16"
  default_locale: "zh-CN"
  default_genre: "ancient"          # 默认题材 → genre-presets.yaml
  default_episode_count: 30
  default_episode_duration_s: 75    # tech.md: 0-3s 钩子 + 3-50s 冲突 + 50-65s 反转 + 65-75s 悬念
  default_target_audience: "general"

# 全局模式：mock | live | hybrid (live primary + graceful mock fallback)
mode: "hybrid"

# ------------------------------------------------------------
# Mock 适配器选型（mode=mock 时全用）
# ------------------------------------------------------------
adapters:
  llm: "mock"
  render_primary: "mock_xiaoyunque"
  render_fallback: "mock_seedance"
  image: "mock_image"
  tts: "mock"
  music: "mock"
  sfx: "mock"
  qa: "mock"
  vlm: "mock"
  moderation: "mock"
  embedding: "mock"
  storage: "local_fs"
  state: "sqlite"
  cover: "mock"

# ------------------------------------------------------------
# Live 适配器配置（mode=live|hybrid 时启用）
# ------------------------------------------------------------
live:
  # ---- Shell 1 编剧大脑（国产优先链） ----
  script:
    # 国内默认：火山方舟 Doubao Seed 1.6 — 中文创作能力极强，价格不到 Claude 的 1/10
    # 想用 Claude 把 primary 改为 "anthropic_opus" 并填好 ANTHROPIC_API_KEY 即可
    primary: "ark_doubao_seed_1_6"
    fallback: "real_llm_chain"       # 走 DashScope/DeepSeek/GLM/月之暗面 链
    novel_model: "doubao-seed-1-6-250615"
    episode_model: "doubao-seed-1-6-250615"
    formatter_model: "doubao-seed-1-6-250615"   # 小云雀友好模板格式化
    max_tokens_novel: 200000
    max_tokens_episode: 32000

  llm:
    # 全国产化默认（MANHUAJU_DOMESTIC_ONLY=true）：仅境内厂商。
    # 境外厂商（anthropic/groq/mistral/openai）仅在 MANHUAJU_DOMESTIC_ONLY=false
    # 且配置了对应 API key 时由 provider_settings 追加，不在此列出。
    providers: ["volcengine", "dashscope", "deepseek", "glm", "moonshot"]
    json_mode: true
    request_timeout_s: 90
    max_retries: 3

  # ---- Shell 2 角色资产库 ----
  image:
    primary: "volcengine_seedream"    # Seedream 5.0 — 14 张多角度
    fallback: "volcengine_jimeng"     # 即梦 4.6 — 姿态/服装变体
    seedream_req_key: "seedream_5_0_t2i"
    jimeng_req_key: "jimeng_high_aes_general_v46"
    images_per_character: 14          # 8 (Seedream) + 6 (Jimeng)
    images_per_scene: 6               # 近/中/远 × 昼/夜
    poll_interval_s: 3
    max_poll_s: 180

  # ---- Shell 3 小云雀 Agent 2.0 ★ 核心生产引擎（双轨路由）----
  video:
    # engine 路由：
    #   auto              → 按 budget_tier 自动选档（H → xiaoyunque_v2，M/L → manhuaju_agent）
    #   xiaoyunque_v2     → 小云雀 Agent 2.0「有参考」单 shot（cinematic 最佳一致性）
    #   manhuaju_agent    → 火山「短剧漫剧 Agent」原生 4 步端到端集成接口
    engine: "auto"
    # 渲染主引擎 = 火山方舟 Seedance（doubao-seedance-1-0-pro）。
    # 选它的关键原因：Seedance 产物托管在 ark-content-generation-cn-beijing.
    # tos-cn-beijing.volces.com（火山自有 TOS），VeFaaS(cn-beijing) 可直接下载；
    # 而小云雀/即梦产物在 *.aigc-cloud.com CDN，VeFaaS 出网拉不到（实测下载
    # <200KB 占位）导致每个 shot 静默降级 mock。实测 Seedance 产出 4.4MB 真片。
    primary: "volcengine_seedance"
    fallback: "volcengine_seedance"
    seedance_model: "doubao-seedance-1-0-pro-250528"
    # NOTE: skylark_* 短剧 Agent 需要单独开通；本账号未开通会返回 50200
    #       "req_key not supported" → 每个 shot 静默降级到 mock（68KB 占位）。
    #       即梦 (Jimeng) 通用视频模型在标准视觉套餐即可用，故默认使用它。
    #       如已开通小云雀，把下面改回 skylark_video_agent_v2_with_ref 即可。
    xiaoyunque_req_key: "jimeng_t2v_v30"
    duanju_req_key: "jimeng_t2v_v30"
    mode: "per_shot"                  # per_episode | per_shot（jimeng 走单 shot）
    reference_weight: 0.85            # tech.md 防线 3：强约束
    poll_interval_s: 10
    max_poll_s: 2400                  # 40 min 单集上限（小云雀官方 30 min）
    max_concurrent: 1                 # 本账号视觉 API 并发上限=1（50430 否则）
    retry_per_episode: 3
    # 火山「短剧漫剧 Agent」原生 4 步集成 API（doc 85621/2459788）
    manhuaju_agent:
      req_keys:
        script_analysis:   "pippit_shortplay_cvtob_script_analysis"
        material_design:   "pippit_shortplay_cvtob_material_design"
        video_generate_fast: "pippit_shortplay_cvtob_video_generate_fast720p"
        video_generate_pro:  "pippit_shortplay_cvtob_video_generate_pro720p"
        video_compose_fast:  "pippit_shortplay_cvtob_video_compose_fast720p"
        video_compose_pro:   "pippit_shortplay_cvtob_video_compose_pro720p"
      poll_interval_s: 10
      max_poll_s: 2400
      max_poll_video_s: 3600
      max_poll_compose_s: 1800
      default_visual_style: "真人写实, 电影风格, 冷色调,都市女频"
      default_video_ratio: "16:9"
      max_retries_per_episode: 2
      output_root: "api_data/manhuaju_agent"
    routing_rule: |
      budget_tier == 'H' -> xiaoyunque_v2 (¥60-80/集，最佳一致性)
      budget_tier in ('M','L') -> manhuaju_agent (¥30-50/集，集成度最高)

  # ---- Shell 4 质检与重生 ----
  vlm_qa:
    primary: "ark_doubao_seed_1_6"    # Doubao Seed 1.6 视觉
    fallback: "real_llm_judge"
    judge_model: "doubao-seed-1-6-250615"
    frames_per_shot: 5                # 首/1/4/2/4/3/4/末
    seven_dim_threshold: 8.0          # 7 维 mean

  face_repair:
    # 国内默认：直接用火山 Seedance 单镜重生（同栈、低延迟、无需境外信用卡）
    # 想用 fal.ai Wan 2.7 FLF 把 primary 改为 "fal_wan27_flf" 并填 FAL_KEY 即可
    primary: "volcengine_seedance"
    fallback: "fal_wan27_flf"         # 国际版兜底；FAL_KEY 缺失时自动跳过
    arcface_threshold: 0.78           # 低于则触发重生
    cross_episode_threshold: 0.92     # 跨集 ArcFace KPI

  consistency:
    backend: "insightface"            # buffalo_l CPU 推理
    model_root: "/opt/insightface/models"
    embedding_dim: 512
    batch_size: 8

  # ---- 后期 ----
  tts:
    primary: "dashscope_cosyvoice"
    fallback: "doubao_icl_v3"
    sample_rate: 24000

  music:
    # 国内默认：本地 CC0 曲库（按情绪/题材选拾，版权干净，零成本零延迟）
    # 想用 ElevenLabs 把 primary 改为 "elevenlabs" 并填 ELEVENLABS_API_KEY
    primary: "local_library"
    fallback: "elevenlabs"
    library_root: "assets/bgm"
    duration_s: 75
    instrumental: true

  sfx:
    # 国内默认：ffmpeg 本地合成简单音效（脚步/翻页/风声等模板）
    primary: "local_synthesis"
    fallback: "elevenlabs"
    max_cues_per_episode: 12

  cover:
    primary: "volcengine_jimeng"      # 即梦 4.6 大图 + Pillow 文字层
    fallback: "mock"
    aspect_ratios: ["9:16", "3:4", "1:1"]
    title_font: "思源宋体"
    body_font: "思源黑体"

  subtitle:
    engine: "ass"                     # 自渲染 ASS，绕开小云雀乱码
    font: "思源黑体"
    title_font: "思源宋体"
    font_size: 56
    outline: 3
    shadow: 1
    margin_v: 80

  # ---- 嵌入 / 审核 ----
  embedding:
    primary: "dashscope_text_embedding_v3"

  moderation:
    primary: "real_llm_judge"
    # 国内默认：火山方舟 Doubao（合规审核能力强、中文敏感词识别准）
    judge_model: "doubao-seed-1-6-250615"

  # ---- 对象存储 ----
  storage:
    primary: "volcengine_tos"
    fallback: "local_fs"
    bucket: "manhuaju-assets"
    region: "cn-beijing"
    presign_ttl_s: 86400              # 24h 给小云雀拉图

  # ---- 数据库 ----
  database:
    primary: "postgres"               # 生产
    fallback: "sqlite"                # 单机/开发
    dsn_env: "POSTGRES_DSN"

  # ---- 预算 ----
  budget:
    rmb_cap_per_episode: 80           # 单集硬上限
    rmb_cap_v4_target: 60             # v4 软目标（tech.md ≈ ¥50-60）
    runtime_cap_min: 60               # 单集时长上限

# ------------------------------------------------------------
# Mock 简化参数（用于 mock + e2e 测试）
# ------------------------------------------------------------
mock:
  shot_duration_s: 1
  max_shots_per_episode: 6
  max_dialogue_lines: 2
  max_repairs: 3
  resolution: "720p"
  fps: 12

# ------------------------------------------------------------
# Workflow & Distribution
# ------------------------------------------------------------
workflow:
  mode: autopilot                     # autopilot | supervised
  candidates_per_shot: 3
  stages: [analyze, assets, prompts, draw, qa, repair, rough_cut, fine_cut, distribution]
  enable_continuation: false          # 高阶：自动续写后续集
  enable_style_transfer: false        # 高阶：风格一键迁移

distribution:
  default_platform: "douyin"          # douyin | kuaishou | weixin
  platforms: ["douyin", "kuaishou", "weixin"]
  watermark: false
  generate_cover: true
  generate_copy: true                 # 自动生成标题/简介/tags/引流文案
  multi_format: ["short_video", "long_manhua", "graphic_pdf"]

# ------------------------------------------------------------
# 安全 / 合规
# ------------------------------------------------------------
content_safety:
  enabled: true
  sensitive_words_path: "config/sensitive-words.yaml"
  llm_judge_model: "doubao-seed-1-6-250615"   # 国内默认；改写/裁定都走 Doubao
  fail_on_high: true                  # 高敏感词直接中断
  fail_on_medium_after_retry: true    # 中敏感词改写 1 次后仍命中则中断

copyright_check:
  enabled: true
  simhash_bits: 64
  similarity_threshold: 0.85
  corpus_dir: "config/copyright_corpus/"
