# Template: 都市经典短剧 (cdrama_classic)
# Use case: high-density emotional drama, 60s/episode, 12-shot grids.
# Variables (Jinja2-style {{ var }}) are resolved by template_engine.

template_id: cdrama_classic
version: 1
display_name_zh: "都市经典短剧"
display_name_en: "Urban Classic Drama"

defaults:
  episode_count: 3
  episode_duration_s: 60
  genre: cdrama_classic
  style_preset_id: cinematic_2d_v1
  render_tier: M
  scene_reuse_threshold: 0.85
  emotion_arcface_min: 0.94
  outfit_arcface_min: 0.94
  parallel_render_slots: 16
  repair_max_attempts: 4

variables:
  - name: protagonist_name
    type: string
    required: true
    description: "主角名字"
  - name: antagonist_name
    type: string
    required: false
    default: "未署名"
  - name: setting_city
    type: string
    required: true
    description: "故事发生的城市"
  - name: dramatic_hook
    type: string
    required: true
    description: "一句话钩子"

beats:
  - act_1_setup_s: 8
  - inciting_incident_s: 15
  - act_2_conflict_s: 30
  - midpoint_twist_s: 38
  - act_3_climax_s: 50
  - resolution_s: 60

shot_plan_template:
  - shot_id: "ep{{ ep }}-shot-001"
    scale: wide
    duration_s: 4
    purpose: "establishing"
  - shot_id: "ep{{ ep }}-shot-002"
    scale: medium
    duration_s: 5
    purpose: "{{ protagonist_name }} introduction"
  - shot_id: "ep{{ ep }}-shot-003"
    scale: close
    duration_s: 4
    purpose: "emotion reaction"
  - shot_id: "ep{{ ep }}-shot-004"
    scale: medium
    duration_s: 5
    purpose: "dialogue exchange"
  - shot_id: "ep{{ ep }}-shot-005"
    scale: wide
    duration_s: 5
    purpose: "rising action"
  - shot_id: "ep{{ ep }}-shot-006"
    scale: close
    duration_s: 5
    purpose: "midpoint twist {{ dramatic_hook }}"
  - shot_id: "ep{{ ep }}-shot-007"
    scale: medium
    duration_s: 5
    purpose: "conflict"
  - shot_id: "ep{{ ep }}-shot-008"
    scale: close
    duration_s: 5
    purpose: "antagonist {{ antagonist_name }} reaction"
  - shot_id: "ep{{ ep }}-shot-009"
    scale: wide
    duration_s: 5
    purpose: "climax setup"
  - shot_id: "ep{{ ep }}-shot-010"
    scale: medium
    duration_s: 5
    purpose: "climax action"
  - shot_id: "ep{{ ep }}-shot-011"
    scale: close
    duration_s: 6
    purpose: "resolution emotion"
  - shot_id: "ep{{ ep }}-shot-012"
    scale: wide
    duration_s: 6
    purpose: "{{ setting_city }} cityscape closer"

distribution:
  platforms: [douyin, kuaishou, video_hao, bilibili, youtube]
  hashtags: [短剧, 都市, "{{ protagonist_name }}", "{{ setting_city }}"]
