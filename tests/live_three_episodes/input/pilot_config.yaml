  fps: 24
  target_locales: ["zh-CN"]
  episode_count: 3
  consistency_tier: "bible_only"
  model_tier: "pro"
  budget_tier: "S"
  narration: false
  mode: "per_shot"
  redlines_profile_id: "default"
  simhuman_consent: false
mock:
