[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "manhuaju-autopilot"
version = "0.4.0"
description = "AI Manhuaju Autopilot v4 — novel-to-multi-episode video with character consistency (Xiaoyunque Agent 2.0 fast-path + 5-shell architecture)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Manhuaju Autopilot Agents" }]
dependencies = [
    "pydantic>=2.7,<3",
    "Pillow>=10.2",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "anyio>=4.3",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pysubs2>=1.7",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
]
live = [
    "dashscope>=1.20",
    "anthropic>=0.40",
    "volcengine>=1.0.222",
    "tos>=2.7",
    "elevenlabs>=1.0",
    "fal-client>=0.5",
]
consistency = [
    "insightface>=0.7.3",
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.9",
]
i18n = [
    "opencc-python-reimplemented>=0.1.7",
    "cn2an>=0.5.22",
    "tiktoken>=0.7",
]
observe = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "prometheus-client>=0.20",
]
db = [
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]
whitepaper = [
    "scipy>=1.13",
    "matplotlib>=3.8",
    "pandas>=2.2",
]
all = [
    "manhuaju-autopilot[live,consistency,i18n,observe,db,whitepaper]",
]

[project.scripts]
manhuaju = "manhuaju.cli:main"
manhuaju-pilot = "scripts.run_pilot:cli"
manhuaju-live = "scripts.run_live_pilot:cli"
manhuaju-keys = "scripts.smoke_keys:main"

[tool.hatch.build.targets.wheel]
packages = ["src/manhuaju"]

[tool.hatch.build.targets.wheel.force-include]
"src" = "manhuaju"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true
mypy_path = "src"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "tools", "scripts"]
extend-exclude = [".kiro", "docs", "tests/e2e_three_episodes/output", "tests/e2e_three_episodes/reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]
