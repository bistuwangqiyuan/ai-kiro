<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 漫剧 Autopilot v4 · 控制台</title>
  <style>
    :root {
      --bg: #0e1218;
      --fg: #f5f5f7;
      --muted: #8a93a1;
      --card: #161c25;
      --border: #2a313d;
      --accent: #ffd47a;
      --accent2: #7fb3ff;
      --success: #5fdc7f;
      --warn: #ffb74d;
      --danger: #ff6b6b;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", "Source Han Sans CN", "PingFang SC", sans-serif;
      background: var(--bg); color: var(--fg); margin: 0; line-height: 1.6;
    }
    header {
      padding: 16px 32px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(120deg, #161c25, #0e1218);
    }
    header h1 { font-size: 18px; margin: 0; letter-spacing: 1px; }
    header .pill {
      padding: 4px 10px; border-radius: 999px; font-size: 11px;
      background: var(--card); border: 1px solid var(--border); color: var(--muted);
    }
    .container { max-width: 1280px; margin: 0 auto; padding: 24px 32px; }
    .grid { display: grid; gap: 20px; }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-2 { grid-template-columns: 1.4fr 1fr; }
    @media (max-width: 960px) {
      .grid-3, .grid-2 { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
    }
    .card h2 { font-size: 14px; margin: 0 0 12px 0; color: var(--accent); letter-spacing: 1px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-top: 10px; }
    input, textarea, select {
      width: 100%; background: var(--bg); color: var(--fg);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 12px; font-size: 13px; font-family: inherit;
    }
    textarea { min-height: 140px; resize: vertical; }
    button {
      background: var(--accent); color: #1a1a1a; border: none;
      padding: 10px 18px; border-radius: 8px; font-weight: 600;
      cursor: pointer; font-size: 13px; margin-top: 16px;
    }
    button.ghost { background: transparent; color: var(--accent2); border: 1px solid var(--accent2); }
    button:hover { opacity: 0.92; }
    .stat { display: flex; justify-content: space-between; align-items: center; padding: 8px 0;
            border-bottom: 1px dashed var(--border); font-size: 13px; }
    .stat:last-child { border: none; }
    .stat .v { font-family: 'JetBrains Mono', Consolas, monospace; color: var(--accent2); }
    .pill-ok { background: rgba(95, 220, 127, 0.15); color: var(--success);
               padding: 2px 8px; border-radius: 4px; font-size: 11px; }
    .pill-warn { background: rgba(255, 183, 77, 0.15); color: var(--warn);
                 padding: 2px 8px; border-radius: 4px; font-size: 11px; }
    .pill-bad { background: rgba(255, 107, 107, 0.15); color: var(--danger);
                padding: 2px 8px; border-radius: 4px; font-size: 11px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 8px 4px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--muted); font-weight: 500; font-size: 11px; }
    code { font-family: 'JetBrains Mono', Consolas, monospace; color: var(--accent2); font-size: 11px; }
    .small { font-size: 11px; color: var(--muted); }
    .row { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
    .footer { padding: 24px 32px; color: var(--muted); font-size: 11px; text-align: center; }
  </style>
</head>
<body>
<header>
  <h1>AI 漫剧 Autopilot · <span style="color:var(--accent);">v4</span></h1>
  <div style="display:flex;gap:12px;align-items:center">
    <a href="/console/simple.html" style="color:var(--accent2);font-size:13px;text-decoration:none">简易模式</a>
    <a href="/console/pro.html" style="color:var(--accent2);font-size:13px;text-decoration:none">专业模式</a>
    <a href="/assets" style="color:var(--accent2);font-size:13px;text-decoration:none">资产库</a>
    <a href="/gallery" style="color:var(--accent2);font-size:13px;text-decoration:none">视频广场</a>
    <a href="/console/guide.html" style="color:var(--accent);font-size:13px;text-decoration:none">使用说明</a>
    <span id="auth-pill"></span>
    <span class="pill" id="mode-pill">loading…</span>
  </div>
</header>

<div class="container grid grid-3">
  <!-- 1. New project -->
  <div class="card">
    <h2>① 一键开剧</h2>
    <label>题材</label>
    <select id="genre">
      <option value="ancient">古风</option>
      <option value="modern">现代</option>
      <option value="sweet_pet">甜宠</option>
      <option value="suspense">悬疑</option>
      <option value="xuanhuan">玄幻</option>
      <option value="xianxia">仙侠</option>
      <option value="campus">校园</option>
      <option value="urban">都市</option>
    </select>

    <label>集数 <span class="small">（默认 1 集，最短体验真实接口）</span></label>
    <input id="episode-count" type="number" value="1" min="1" max="120" />

    <label>每集时长 (秒) <span class="small">（默认 30s，跑通真实流水线最快）</span></label>
    <input id="episode-duration" type="number" value="30" min="30" max="180" />

    <label>分发平台 (逗号分隔)</label>
    <input id="platforms" value="douyin,kuaishou,weixin" />

    <label>小说原文 / 概念</label>
    <textarea id="novel-text" placeholder="贴入小说原文，或写一段构思（≥10 字）…"></textarea>

    <label>角色资产 <span class="small">（可选，<a href="/assets" style="color:var(--accent2)">上传/管理</a>，点击选中作为参考图）</span></label>
    <div id="char-asset-picker" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <span class="small">加载中…</span>
    </div>

    <button onclick="createProject()">提交 →</button>
    <button class="ghost" onclick="loadDemo()">载入示例</button>
    <div class="small" id="create-result"></div>
  </div>

  <!-- 2. Novel writer -->
  <div class="card">
    <h2>② 小说一键生成 / 续写 / 风格迁移</h2>
    <label>模式</label>
    <select id="novel-mode">
      <option value="generate">generate · 全新</option>
      <option value="continuation">continuation · 续写</option>
      <option value="style_transfer">style_transfer · 风格迁移</option>
    </select>
    <label>题材</label>
    <select id="novel-genre">
      <option value="ancient">古风</option>
      <option value="modern">现代</option>
      <option value="sweet_pet">甜宠</option>
      <option value="suspense">悬疑</option>
      <option value="xuanhuan">玄幻</option>
      <option value="xianxia">仙侠</option>
    </select>
    <label>章节数</label>
    <input id="novel-chapters" type="number" value="12" min="1" max="60" />
    <label>提示词 / 原文</label>
    <textarea id="novel-prompt"
      placeholder="generate 模式：写一段灵感 / 概念；continuation 模式：贴入原文；style_transfer：贴入待迁移原文"></textarea>
    <button onclick="createNovel()">生成 →</button>
    <div class="small" id="novel-result"></div>
  </div>

  <!-- 3. KPI -->
  <div class="card">
    <h2>③ v4 KPI 阈值</h2>
    <div id="kpi-list"><div class="small">loading…</div></div>
  </div>
</div>

<div class="container grid grid-2">
  <!-- 4. Projects -->
  <div class="card">
    <h2>④ 最近项目</h2>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:0;cursor:pointer">
        <input type="checkbox" id="mine-only" style="width:auto;margin:0" />
        只看我的
      </label>
      <span id="mine-hint" class="small"></span>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>项目 ID</th>
            <th>状态</th>
            <th>题材</th>
            <th>阶段</th>
            <th>归属</th>
            <th>视频</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="projects-tbody"><tr><td colspan="7" class="small">loading…</td></tr></tbody>
      </table>
    </div>
    <button class="ghost" onclick="loadProjects()">刷新</button>
  </div>

  <!-- 5. Capabilities -->
  <div class="card">
    <h2>⑤ Provider 能力图</h2>
    <div id="providers"><div class="small">loading…</div></div>
  </div>
</div>

<div class="footer">
  Manhuaju Autopilot v4 · 小云雀 Agent 2.0 快路径 ·
  <a href="/console/guide.html" style="color:var(--accent2)">使用说明</a> ·
  火山引擎 / Anthropic / ElevenLabs / fal.ai
</div>

<script src="/console/auth.js"></script>
<script>
const API = window.API_BASE || '';
const _fetch = (typeof authedFetch === 'function') ? authedFetch : fetch;

async function jget(url) {
  const r = await _fetch(API + url);
  if (!r.ok) throw new Error(r.statusText);
  return r.json();
}
async function jpost(url, body) {
  const r = await _fetch(API + url, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  return r.json();
}

if (window.ManhuajuAuth) {
  window.ManhuajuAuth.renderAuthPill('auth-pill');
}

async function loadHealth() {
  const h = await jget('/health');
  document.getElementById('mode-pill').textContent =
    `${h.system_mode} · ${h.fast_path_ready ? '✓ fast-path ready' : 'degraded'}`;

  const prov = document.getElementById('providers');
  prov.innerHTML = '';
  for (const [name, info] of Object.entries(h.providers || {})) {
    if (name === 'llm_chain') {
      const div = document.createElement('div');
      div.className = 'stat';
      div.innerHTML = `<span>llm_chain</span><span class="v">${(info||[]).length} 家</span>`;
      prov.appendChild(div);
      continue;
    }
    const div = document.createElement('div');
    div.className = 'stat';
    const pill = info.enabled
      ? '<span class="pill-ok">enabled</span>'
      : '<span class="pill-bad">missing</span>';
    div.innerHTML = `<span>${name}</span><span>${pill}</span>`;
    prov.appendChild(div);
  }
}

async function loadKpi() {
  try {
    const kpi = await jget('/v1/kpi');
    const t = kpi.thresholds || {};
    const el = document.getElementById('kpi-list');
    el.innerHTML = '';
    const rows = [
      ['跨集 ArcFace ≥', t.arcface_min],
      ['7 维 mean ≥', t.seven_dim_mean_min],
      ['乱码率 ≤', t.garbled_text_rate_max],
      ['高敏命中 ≤', t.sensitive_high_hit_max],
      ['cycles ≤', t.cycles_max],
      ['单集 RMB 软目标', (kpi.cost_caps_rmb||{}).per_episode_v4_target],
      ['单集 RMB 硬上限', (kpi.cost_caps_rmb||{}).per_episode_v4_hard],
    ];
    rows.forEach(([k, v]) => {
      const div = document.createElement('div');
      div.className = 'stat';
      div.innerHTML = `<span>${k}</span><span class="v">${v ?? '-'}</span>`;
      el.appendChild(div);
    });
  } catch (e) {
    document.getElementById('kpi-list').innerHTML = '<div class="small">无 KPI</div>';
  }
}

async function loadProjects() {
  const mineCb = document.getElementById('mine-only');
  const hintEl = document.getElementById('mine-hint');
  const auth = window.ManhuajuAuth && window.ManhuajuAuth.getAuth();
  let url = '/v1/projects?limit=20';
  let mineEffective = false;
  if (mineCb && mineCb.checked) {
    if (!auth) {
      if (hintEl) hintEl.textContent = '请先登录';
      mineCb.checked = false;
    } else {
      url = '/v1/projects?limit=20&mine=1';
      mineEffective = true;
      if (hintEl) hintEl.textContent = '已筛选：' + auth.username;
    }
  } else if (hintEl) {
    hintEl.textContent = '';
  }
  try {
    const j = await jget(url);
    const tb = document.getElementById('projects-tbody');
    tb.innerHTML = '';
    if (!j.projects.length) {
      tb.innerHTML = '<tr><td colspan="7" class="small">' + (mineEffective ? '你还没有提交任何项目。' : '暂无项目') + '</td></tr>';
      return;
    }
    for (const p of j.projects) {
      const tr = document.createElement('tr');
      let pill = '<span class="pill-warn">running</span>';
      if (p.status === 'succeeded' || p.status === 'released' || p.status === 'completed') {
        pill = '<span class="pill-ok">' + p.status + '</span>';
      }
      if (p.status === 'failed' || p.status === 'error') pill = '<span class="pill-bad">failed</span>';
      const watch = (p.status === 'released' || p.status === 'succeeded' || p.status === 'completed')
        ? `<a href="/gallery?project=${p.project_id}" style="color:var(--accent2)">观看</a>`
        : '<span class="small">—</span>';
      const owner = p.owner ? `<span class="small">${p.owner}</span>` : '<span class="small">匿名</span>';
      tr.innerHTML =
        `<td><code>${p.project_id || '-'}</code></td>`
      + `<td>${pill}</td>`
      + `<td>${p.genre || '-'}</td>`
      + `<td>${p.stage || '-'}</td>`
      + `<td>${owner}</td>`
      + `<td>${watch}</td>`
      + `<td><a href="#" onclick="alert(JSON.stringify(${JSON.stringify(p).replace(/"/g, '&quot;')}, null, 2));return false">详情</a></td>`;
      tb.appendChild(tr);
    }
  } catch (e) {
    document.getElementById('projects-tbody').innerHTML =
      '<tr><td colspan="7" class="small">列表暂不可用</td></tr>';
  }
}

(function wireMineToggle() {
  const cb = document.getElementById('mine-only');
  if (cb) cb.addEventListener('change', loadProjects);
  window.addEventListener('manhuaju-auth', loadProjects);
})();

const selectedAssetIds = new Set();
function renderCharPicker(assets) {
  const box = document.getElementById('char-asset-picker');
  if (!box) return;
  if (!assets.length) {
    box.innerHTML = '<span class="small">暂无角色资产，去 <a href="/assets" style="color:var(--accent2)">资产库</a> 上传。</span>';
    return;
  }
  box.innerHTML = assets.map(a =>
    `<img src="${a.media_url}" data-id="${a.asset_id}" title="${(a.name||'').replace(/"/g,'')}" `
    + `style="width:56px;height:70px;object-fit:cover;border-radius:6px;border:2px solid transparent;cursor:pointer;background:#000" />`
  ).join('');
  box.querySelectorAll('img').forEach(img => {
    img.addEventListener('click', () => {
      const id = img.dataset.id;
      if (selectedAssetIds.has(id)) { selectedAssetIds.delete(id); img.style.borderColor = 'transparent'; }
      else { selectedAssetIds.add(id); img.style.borderColor = 'var(--accent2)'; }
    });
  });
}
(function loadCharAssets() {
  const f = (typeof authedFetch === 'function') ? authedFetch : fetch;
  f('/v1/assets?asset_type=character&limit=100').then(r => r.json())
    .then(d => renderCharPicker(d.assets || [])).catch(() => {});
})();

async function createProject() {
  const body = {
    novel_text: document.getElementById('novel-text').value || '示例小说内容…（请粘贴 ≥10 字）',
    seed: 20260516,
    episode_count: +document.getElementById('episode-count').value,
    style_preset_id: 'cinematic_2d_v1',
    genre: document.getElementById('genre').value,
    episode_duration_s: +document.getElementById('episode-duration').value,
    platforms: document.getElementById('platforms').value.split(',').map(s => s.trim()).filter(Boolean),
    character_asset_ids: Array.from(selectedAssetIds),
  };
  const r = await jpost('/v1/projects', body);
  document.getElementById('create-result').innerHTML =
    `<br>项目 <code>${r.project_id}</code> 已 ${r.status}。完成后可在 <a href="/gallery?project=${r.project_id}" style="color:var(--accent2)">视频广场</a> 观看。`;
  loadProjects();
}

async function createNovel() {
  const body = {
    mode: document.getElementById('novel-mode').value,
    prompt: document.getElementById('novel-prompt').value,
    original_text: document.getElementById('novel-prompt').value,
    genre: document.getElementById('novel-genre').value,
    n_chapters: +document.getElementById('novel-chapters').value,
    target_chars: 12000,
  };
  const r = await jpost('/v1/novels', body);
  document.getElementById('novel-result').innerHTML =
    `<br>小说 <code>${r.title || r.project_id}</code> 已生成（${r.n_chapters || 0} 章）。`;
}

function loadDemo() {
  document.getElementById('novel-text').value =
    "她从未想过，重生之后第一个见到的，竟是那个她以为已经死了的男人……";
}

(async () => {
  await loadHealth();
  await loadKpi();
  await loadProjects();
})();
</script>
</body>
</html>
