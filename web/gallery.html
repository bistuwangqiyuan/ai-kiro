<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 漫剧 Autopilot — 视频广场</title>
  <style>
    :root {
      --bg: #0e1218; --panel: #161c25; --line: #2a313d;
      --fg: #f5f5f7; --muted: #8a93a1; --accent: #ffd47a; --accent2: #7fb3ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.5; }
    header {
      padding: 16px 28px; border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; background: rgba(14,18,24,.95); z-index: 10;
    }
    header h1 { margin: 0; font-size: 17px; }
    header nav a { color: var(--muted); text-decoration: none; font-size: 13px; margin-left: 16px; }
    header nav a:hover, header nav a.active { color: var(--accent2); }
    .hero { max-width: 1200px; margin: 24px auto 0; padding: 0 24px; }
    .hero h2 { margin: 0 0 8px; font-size: 22px; color: var(--accent); }
    .hero p { margin: 0; color: var(--muted); font-size: 14px; }
    .filters { max-width: 1200px; margin: 20px auto; padding: 0 24px; display: flex; gap: 10px; flex-wrap: wrap; }
    .filters button {
      background: var(--panel); border: 1px solid var(--line); color: var(--fg);
      padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .filters button.active { border-color: var(--accent2); color: var(--accent2); }
    .grid {
      max-width: 1200px; margin: 0 auto 48px; padding: 0 24px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;
    }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    }
    .card video { width: 100%; display: block; background: #000; aspect-ratio: 9/16; object-fit: contain; max-height: 420px; }
    .card .body { padding: 14px 16px; }
    .card h3 { margin: 0 0 6px; font-size: 15px; }
    .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; }
    .badge { background: #1a2230; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
    .badge.sample { color: var(--accent); border: 1px solid rgba(255,212,122,.3); }
    .empty { text-align: center; color: var(--muted); padding: 48px; grid-column: 1/-1; }
    .loading { text-align: center; color: var(--muted); padding: 48px; }
  </style>
</head>
<body>
  <header>
    <h1>漫剧 Autopilot · <span style="color:var(--accent)">视频广场</span></h1>
    <nav>
      <a href="/">控制台</a>
      <a href="/console/simple.html">简易模式</a>
      <a href="/console/pro.html">专业模式</a>
      <a href="/guide">使用说明</a>
      <a href="/gallery" class="active">视频广场</a>
    </nav>
  </header>

  <div class="hero">
    <h2>示例与用户作品</h2>
    <p>官方 Pilot 三集示例 + 所有用户成功发布的漫剧成片。制作完成后会自动出现在此页面。</p>
  </div>

  <div class="filters">
    <button class="active" data-filter="all">全部</button>
    <button data-filter="sample">官方示例</button>
    <button data-filter="user">用户作品</button>
  </div>

  <div class="grid" id="grid"><div class="loading">加载中…</div></div>

  <script>
    const params = new URLSearchParams(location.search);
    const projectFilter = params.get('project');
    let allVideos = [];

    function playUrl(v) {
      if (v.video_url && v.video_url.startsWith('http')) return v.video_url;
      return '/media/videos/' + v.video_id;
    }
    function coverUrl(v) {
      if (v.cover_url && v.cover_url.startsWith('http')) return v.cover_url;
      if (v.cover_url) return v.cover_url;
      return '';
    }

    function render(filter) {
      const grid = document.getElementById('grid');
      let items = allVideos;
      if (projectFilter) items = items.filter(v => v.project_id === projectFilter);
      if (filter === 'sample') items = items.filter(v => v.is_sample);
      if (filter === 'user') items = items.filter(v => !v.is_sample);
      if (!items.length) {
        grid.innerHTML = '<div class="empty">暂无视频。去 <a href="/console/simple.html" style="color:var(--accent2)">简易模式</a> 制作第一集吧！</div>';
        return;
      }
      grid.innerHTML = items.map(v => `
        <article class="card">
          <video controls preload="metadata" ${coverUrl(v) ? `poster="${coverUrl(v)}"` : ''} src="${playUrl(v)}"></video>
          <div class="body">
            <h3>${escapeHtml(v.title)}</h3>
            <div class="meta">
              ${v.is_sample ? '<span class="badge sample">官方示例</span>' : '<span class="badge">用户作品</span>'}
              <span class="badge">${v.episode_id}</span>
              <span class="badge">${v.genre}</span>
              <span class="badge">${v.platform}</span>
              <span class="badge">${v.project_id}</span>
            </div>
          </div>
        </article>
      `).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    document.querySelectorAll('.filters button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render(btn.dataset.filter);
      });
    });

    fetch('/v1/gallery?limit=200')
      .then(r => r.json())
      .then(d => { allVideos = d.videos || []; render('all'); })
      .catch(() => {
        document.getElementById('grid').innerHTML = '<div class="empty">加载失败，请刷新重试。</div>';
      });
  </script>
</body>
</html>
