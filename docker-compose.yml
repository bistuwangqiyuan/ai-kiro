version: "3.9"

# 本地一键启 manhuaju v4：api + worker + postgres + redis + nginx
# 生产环境 → 用 deploy/helm/manhuaju 部署到 VKE。

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: manhuaju-autopilot:0.4.0
    ports:
      - "8080:8080"
    environment:
      MANHUAJU_API_DATA: /data
      MANHUAJU_ENV: local
      # 把 .env 整体注入即可
    env_file:
      - .env
    volumes:
      - manhuaju_data:/data
      - manhuaju_models:/app/_models
    depends_on:
      - postgres
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: manhuaju-autopilot:0.4.0
    command: ["python", "-m", "scripts.run_worker"]
    environment:
      MANHUAJU_API_DATA: /data
      MANHUAJU_ENV: local
      MANHUAJU_WORKER: "1"
    env_file:
      - .env
    volumes:
      - manhuaju_data:/data
      - manhuaju_models:/app/_models
    depends_on:
      - postgres
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: manhuaju
      POSTGRES_USER: manhuaju
      POSTGRES_PASSWORD: manhuaju
    volumes:
      - manhuaju_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  manhuaju_data:
  manhuaju_models:
  manhuaju_pg:
