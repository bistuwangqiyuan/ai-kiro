# ============================================================
# AI 漫剧 Autopilot v4 — CI/CD
# - 单元测试
# - 多架构 Docker 镜像（amd64 + arm64）
# - 推送到火山 VCR (cr-cn-beijing.volces.com)
# - 通过 Helm upgrade 部署到 VKE
# ============================================================

name: build-and-deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: cr-cn-beijing.volces.com
  IMAGE: manhuaju/manhuaju-autopilot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          pip install ruff
          ruff check src tests || true
      - name: Tests
        run: |
          pytest tests/unit -q

  smoke-keys:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[live]"
      - name: Smoke provider keys
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOLCENGINE_VISUAL_AK: ${{ secrets.VOLCENGINE_VISUAL_AK }}
          VOLCENGINE_VISUAL_SK: ${{ secrets.VOLCENGINE_VISUAL_SK }}
          VOLCENGINE_ARK_API_KEY: ${{ secrets.VOLCENGINE_ARK_API_KEY }}
          VOLCENGINE_TOS_AK: ${{ secrets.VOLCENGINE_TOS_AK }}
          VOLCENGINE_TOS_SK: ${{ secrets.VOLCENGINE_TOS_SK }}
          VOLCENGINE_TOS_BUCKET: ${{ secrets.VOLCENGINE_TOS_BUCKET }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python -m scripts.smoke_keys --strict --json

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Login to Volcengine VCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.VCR_USERNAME }}
          password: ${{ secrets.VCR_PASSWORD }}
      - name: Compute tags
        id: tags
        run: |
          SHA="${GITHUB_SHA::8}"
          REF_NAME="${GITHUB_REF_NAME//\//-}"
          echo "tag_sha=$SHA" >> $GITHUB_OUTPUT
          echo "tag_ref=$REF_NAME" >> $GITHUB_OUTPUT
      - name: Build + push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.tags.outputs.tag_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.tags.outputs.tag_ref }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache,mode=max

  deploy-vke:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: 'v3.15.4'
      - name: Configure kubectl
        uses: azure/setup-kubectl@v4
      - name: Write kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.VKE_KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      - name: Helm upgrade
        run: |
          SHA="${GITHUB_SHA::8}"
          helm upgrade --install manhuaju ./deploy/helm/manhuaju \
            --namespace manhuaju \
            --create-namespace \
            --set image.tag=$SHA \
            --set ingress.host=${{ vars.MANHUAJU_HOST }} \
            --wait --timeout 10m
      - name: Health check
        run: |
          for i in {1..30}; do
            STATUS=$(curl -sk https://${{ vars.MANHUAJU_HOST }}/health | grep -o '"status":"ok"' || true)
            if [ -n "$STATUS" ]; then
              echo "✓ /health returned ok"
              exit 0
            fi
            sleep 10
          done
          echo "✗ /health never returned ok"
          exit 1
