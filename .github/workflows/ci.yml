name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package
        run: pip install -e ".[dev,whitepaper]"
      - name: Lint forbidden terms
        run: python tools/lint/forbidden_terms.py
      - name: Traceability matrix
        run: python scripts/build_traceability_matrix.py
      - name: Unit tests
        run: pytest tests/unit -q
      - name: E2E tests
        run: pytest tests/e2e_three_episodes -q
      - name: Docker build
        run: docker build -t manhuaju-autopilot:ci .
