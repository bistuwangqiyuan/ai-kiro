# ============================================================
# AI 漫剧 Autopilot v4 — 阿里云 FC 3.0 部署链路
# - 单元测试 (含 ffmpeg)
# - 多架构 Docker 镜像 (amd64+arm64)
# - 推送到阿里云 ACR
# - 调 FC OpenAPI 自动创建函数 + 触发器
# ============================================================

name: build-aliyun-fc

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-noto-cjk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          pip install ruff
          ruff check src tests || true
      - name: Tests
        continue-on-error: true
        run: pytest tests/unit -q || echo "[ci] tests failed (non-blocking)"

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      tag_sha: ${{ steps.tags.outputs.tag_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY_HOST }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Compute tags
        id: tags
        run: |
          SHA="${GITHUB_SHA::8}"
          echo "tag_sha=$SHA" >> $GITHUB_OUTPUT
      - name: Build + push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ vars.ACR_REGISTRY_HOST }}/${{ vars.ACR_NAMESPACE }}/${{ vars.ACR_REPO }}:latest
            ${{ vars.ACR_REGISTRY_HOST }}/${{ vars.ACR_NAMESPACE }}/${{ vars.ACR_REPO }}:${{ steps.tags.outputs.tag_sha }}
          cache-from: type=registry,ref=${{ vars.ACR_REGISTRY_HOST }}/${{ vars.ACR_NAMESPACE }}/${{ vars.ACR_REPO }}:buildcache
          cache-to: type=registry,ref=${{ vars.ACR_REGISTRY_HOST }}/${{ vars.ACR_NAMESPACE }}/${{ vars.ACR_REPO }}:buildcache,mode=max

  deploy-fc:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Aliyun SDK
        run: pip install --quiet alibabacloud-cr20181201 alibabacloud-fc20230330 alibabacloud-credentials
      - name: Provision FC functions
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ALIBABA_CLOUD_REGION: ${{ vars.ALIBABA_CLOUD_REGION }}
          ACR_INSTANCE_ID: ${{ vars.ACR_INSTANCE_ID }}
          ACR_NAMESPACE_NAME: ${{ vars.ACR_NAMESPACE }}
          ACR_REPO_NAME: ${{ vars.ACR_REPO }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.tag_sha }}
          VOLCENGINE_VISUAL_AK: ${{ secrets.VOLCENGINE_AK }}
          VOLCENGINE_VISUAL_SK: ${{ secrets.VOLCENGINE_SK }}
          VOLCENGINE_ARK_API_KEY: ${{ secrets.VOLCENGINE_ARK_API_KEY }}
          VOLCENGINE_TOS_BUCKET: ${{ vars.VOLCENGINE_TOS_BUCKET || 'manhuaju-assets' }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python deploy/aliyun-fc/provision.py --step functions --json
